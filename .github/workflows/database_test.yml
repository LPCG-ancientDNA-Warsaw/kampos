name: Database CI

on: [push, pull_request] # Trigger

jobs:
  test-db:
    runs-on: ubuntu-latest # Where to run the test
    
    services:
      postgres:
        image: postgres:15
        env: # Environment variables
          POSTGRES_DB: lab_db
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Code checkout
        uses: actions/checkout@v3 # Clone code from Github Repository to the virual Linux machine
      
      - name: Install PostgreSQL Client
        run: sudo apt-get install -y postgresql-client # Install psql

      - name: Install schema
        run:
          export PGPASSWORD='password'
          psql -h localhost -U postgres -d lab_db -f sql/schema.sql
      
      - name: Try the seed and show the result
        run:
          psql -h localhost -U postgres -d lab_db -f sql/seed.sql
          
          echo "--- VIEW SAMPLES_STATUS ---"
          psql -h localhost -U postgres -d lab_db -c "SELECT * FROM lab_data.individuals_status;"