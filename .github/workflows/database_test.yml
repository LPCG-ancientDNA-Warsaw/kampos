name: Database CI

on: [push, pull_request]

jobs:
  test-db:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: lab_db
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Code checkout
        uses: actions/checkout@v3
      
      - name: Install PostgreSQL Client
        run: sudo apt-get install -y postgresql-client

      - name: Install schema
        run: |
          export PGPASSWORD='password'
          psql -h localhost -U postgres -d lab_db -f sql/schema.sql